<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg{fill:#0b1117}.panel{fill:#0f171f;stroke:#29443a}.grid{stroke:#183027;stroke-width:1}.muted{fill:#708078}.text{fill:#e6edf3}.green{fill:#58d6a5}.green2{fill:#1d513e}.line{stroke:#2f8f6d;stroke-width:1.5}.dash{stroke:#58d6a5;stroke-width:1.5;stroke-dasharray:7 9;animation:dash 7s linear infinite}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.blink{animation:blink 1.05s steps(1,end) infinite}.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.p2{animation-delay:.45s}.p3{animation-delay:.9s}.p4{animation-delay:1.35s}.scan{animation:scan 5.2s ease-in-out infinite}.enter1{animation:enter .55s ease-out .15s both}.enter2{animation:enter .55s ease-out .5s both}.enter3{animation:enter .55s ease-out .85s both}.enter4{animation:enter .55s ease-out 1.2s both}@keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}@keyframes pulse{0%,100%{opacity:.55;transform:scale(.88)}50%{opacity:1;transform:scale(1.16)}}@keyframes dash{to{stroke-dashoffset:-128}}@keyframes scan{0%,100%{transform:translateX(-12px);opacity:.15}50%{transform:translateX(78px);opacity:.65}}@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}@media (prefers-reduced-motion:reduce){.blink,.pulse,.dash,.scan,.enter1,.enter2,.enter3,.enter4{animation:none}}
  </style>
