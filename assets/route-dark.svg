<svg width="1200" height="330" viewBox="0 0 1200 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">A visual route from question to system at night</title>
<desc id="desc">A quiet hand-drawn night map connecting a question, a note, an experiment, and a system, with a small moving marker.</desc>
<style>
  .ink{fill:#d0cdc4;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .muted{fill:#777d84;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .line{fill:none;stroke:#555c63;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .faint{fill:none;stroke:#30363d;stroke-width:1.25;stroke-linecap:round}
  .paper{fill:#171b20;stroke:#3b4249;stroke-width:1.4}
  .accent{fill:#d2b06c}
</style>
<rect width="1200" height="330" rx="18" fill="#111418"/>

<text x="54" y="52" class="muted" font-size="14" letter-spacing="2">A SMALL ROUTE</text>
<text x="54" y="82" class="ink" font-size="20">question  →  note  →  experiment  →  system</text>

<path id="route" d="M92 206 C210 154 294 244 405 200 S605 150 704 203 S895 252 1092 183" class="line" stroke-dasharray="5 8"/>
<path d="M92 222 C215 173 296 260 405 217 S605 169 704 219 S892 269 1092 201" class="faint" opacity=".75"/>

<g transform="translate(72 128) rotate(-2 80 52)">
  <rect width="170" height="96" rx="7" class="paper"/>
  <text x="18" y="30" class="muted" font-size="12">01</text>
  <text x="18" y="55" class="ink" font-size="18">question</text>
  <path d="M18 70 H128" class="faint"/>
  <path d="M18 81 H101" class="faint"/>
</g>

<g transform="translate(330 160) rotate(1.5 80 52)">
  <rect width="170" height="96" rx="7" class="paper"/>
  <text x="18" y="30" class="muted" font-size="12">02</text>
  <text x="18" y="55" class="ink" font-size="18">note</text>
  <path d="M18 70 H126" class="faint"/>
  <path d="M18 81 H92" class="faint"/>
</g>

<g transform="translate(618 126) rotate(-1.2 90 52)">
  <rect width="190" height="100" rx="7" class="paper"/>
  <text x="18" y="30" class="muted" font-size="12">03</text>
  <text x="18" y="55" class="ink" font-size="18">experiment</text>
  <circle cx="29" cy="77" r="5" fill="none" stroke="#555c63" stroke-width="1.4"/>
  <path d="M44 77 H132" class="faint"/>
</g>

<g transform="translate(928 150) rotate(2 80 52)">
  <rect width="170" height="96" rx="7" class="paper"/>
  <text x="18" y="30" class="muted" font-size="12">04</text>
  <text x="18" y="55" class="ink" font-size="18">system</text>
  <path d="M21 76 L41 64 L59 76 L78 61 L97 75" class="faint"/>
</g>

<circle r="5.5" class="accent">
  <animateMotion dur="14s" repeatCount="indefinite" rotate="auto">
    <mpath href="#route"/>
  </animateMotion>
</circle>

<text x="54" y="298" class="muted" font-size="13">biology · design · systems · things worth testing</text>
<text x="1146" y="298" text-anchor="end" class="muted" font-size="13">not always in this order</text>
</svg>
