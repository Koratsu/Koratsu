<svg width="1200" height="330" viewBox="0 0 1200 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">How things usually go</title>
<desc id="desc">A loose hand-drawn trail connecting a question, a scribble, a try, and a choice to keep or leave the idea.</desc>
<style>
  .ink{fill:#474640;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .muted{fill:#8f897f;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .line{fill:none;stroke:#b8b0a4;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .faint{fill:none;stroke:#d8d0c4;stroke-width:1.25;stroke-linecap:round}
  .paper{fill:#fffdf8;stroke:#cec5b8;stroke-width:1.4}
  .accent{fill:#c8a25d}
</style>
<rect width="1200" height="330" rx="18" fill="#f6f1e7"/>

<text x="54" y="52" class="muted" font-size="14" letter-spacing="2">HOW IT USUALLY GOES</text>
<text x="54" y="82" class="ink" font-size="20">notice  →  scribble  →  try  →  keep / leave</text>

<path id="route" d="M92 206 C210 154 294 244 405 200 S605 150 704 203 S895 252 1092 183" class="line" stroke-dasharray="5 8"/>
<path d="M92 222 C215 173 296 260 405 217 S605 169 704 219 S892 269 1092 201" class="faint" opacity=".55"/>

<g transform="translate(72 128) rotate(-2 80 52)">
  <rect width="170" height="96" rx="7" class="paper"/>
  <text x="18" y="30" class="muted" font-size="12">01</text>
  <text x="18" y="55" class="ink" font-size="18">wait, why?</text>
  <path d="M18 70 H128" class="faint"/>
  <path d="M18 81 H101" class="faint"/>
</g>

<g transform="translate(330 160) rotate(1.5 80 52)">
  <rect width="170" height="96" rx="7" class="paper"/>
  <text x="18" y="30" class="muted" font-size="12">02</text>
  <text x="18" y="55" class="ink" font-size="18">write it down</text>
  <path d="M18 70 H126" class="faint"/>
  <path d="M18 81 H92" class="faint"/>
</g>

<g transform="translate(618 126) rotate(-1.2 90 52)">
  <rect width="190" height="100" rx="7" class="paper"/>
  <text x="18" y="30" class="muted" font-size="12">03</text>
  <text x="18" y="55" class="ink" font-size="18">try something</text>
  <circle cx="29" cy="77" r="5" fill="none" stroke="#b8b0a4" stroke-width="1.4"/>
  <path d="M44 77 H132" class="faint"/>
</g>

<g transform="translate(928 150) rotate(2 80 52)">
  <rect width="170" height="96" rx="7" class="paper"/>
  <text x="18" y="30" class="muted" font-size="12">04</text>
  <text x="18" y="55" class="ink" font-size="18">keep / leave</text>
  <path d="M21 76 L41 64 L59 76 L78 61 L97 75" class="faint"/>
</g>

<circle r="5.5" class="accent">
  <animateMotion dur="14s" repeatCount="indefinite" rotate="auto">
    <mpath href="#route"/>
  </animateMotion>
</circle>

<text x="54" y="298" class="muted" font-size="13">brains · bread · code · other rabbit holes</text>
<text x="1146" y="298" text-anchor="end" class="muted" font-size="13">rarely this tidy</text>
</svg>
