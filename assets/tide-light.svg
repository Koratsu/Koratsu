<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">A small paper boat crossing a quiet sea</title>
<desc id="desc">A minimal hand-drawn scene with a paper boat drifting across gentle waves.</desc>
<style>
  .ink{stroke:#4b4a46;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#b9b2a7;stroke-width:1.5;fill:none;stroke-linecap:round}
  .boat{stroke:#4b4a46;stroke-width:2;fill:#fffdf8;stroke-linejoin:round}
  .sun{fill:#e8c98b}
  .dot{fill:#8f897f}
  .cloud{fill:#eee8dc;stroke:#b9b2a7;stroke-width:1.5}
</style>
<rect width="1200" height="300" fill="#f6f1e7"/>
<circle cx="1010" cy="66" r="28" class="sun" opacity=".92"/>
<path d="M75 200 C150 193 205 207 280 200 S410 193 485 200 S615 207 690 200 S820 193 895 200 S1025 207 1125 199" class="ink" opacity=".85"/>
<path d="M0 221 C95 214 165 228 255 221 S420 214 510 221 S675 228 765 221 S930 214 1020 221 S1110 225 1200 220" class="soft" opacity=".72"/>
<path d="M0 246 C110 239 175 253 285 246 S460 239 570 246 S745 253 855 246 S1030 239 1200 246" class="soft" opacity=".48"/>
<g opacity=".7">
  <circle cx="88" cy="61" r="1.6" class="dot"/><circle cx="152" cy="91" r="1.2" class="dot"/><circle cx="337" cy="52" r="1.5" class="dot"/><circle cx="588" cy="76" r="1.1" class="dot"/><circle cx="744" cy="47" r="1.4" class="dot"/>
</g>
<g transform="translate(240 0)" opacity=".9">
  <path d="M0 84 C14 72 29 75 38 84 C51 76 68 80 72 92 C56 99 17 99 0 84Z" class="cloud"/>
  <animateTransform attributeName="transform" type="translate" values="240 0;280 0;240 0" dur="24s" repeatCount="indefinite"/>
</g>
<g id="boat" transform="translate(535 165)">
  <g>
    <path d="M0 19 L46 0 L92 19 L70 42 L20 42 Z" class="boat"/>
    <path d="M46 0 L46 34 M0 19 L46 34 L92 19" class="ink"/>
    <path d="M17 49 C34 45 58 45 76 49" class="soft"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0;0 3;0 0" dur="5s" repeatCount="indefinite" additive="sum"/>
  </g>
  <animateTransform attributeName="transform" type="translate" values="535 165;558 165;535 165;512 165;535 165" dur="18s" repeatCount="indefinite"/>
</g>
</svg>
