<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">A small paper boat drifting across a quiet sea</title>
<desc id="desc">A minimal hand-drawn daytime scene with a paper boat moving gently across layered waves.</desc>
<style>
  .ink{stroke:#4b4a46;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#b9b2a7;stroke-width:1.5;fill:none;stroke-linecap:round}
  .faint{stroke:#d4cec3;stroke-width:1.2;fill:none;stroke-linecap:round}
  .boat{stroke:#4b4a46;stroke-width:2;fill:#fffdf8;stroke-linejoin:round}
  .sun{fill:#e8c98b}
  .dot{fill:#8f897f}
  .cloud{fill:#eee8dc;stroke:#b9b2a7;stroke-width:1.5}
</style>
<rect width="1200" height="300" fill="#f6f1e7"/>

<circle cx="1010" cy="66" r="28" class="sun" opacity=".92"/>

<g opacity=".7">
  <circle cx="88" cy="61" r="1.6" class="dot"/>
  <circle cx="152" cy="91" r="1.2" class="dot"/>
  <circle cx="337" cy="52" r="1.5" class="dot"/>
  <circle cx="588" cy="76" r="1.1" class="dot"/>
  <circle cx="744" cy="47" r="1.4" class="dot"/>
</g>

<g transform="translate(215 0)" opacity=".88">
  <path d="M0 84 C14 72 29 75 38 84 C51 76 68 80 72 92 C56 99 17 99 0 84Z" class="cloud"/>
  <animateTransform attributeName="transform" type="translate" values="215 0;245 0;215 0" dur="28s" repeatCount="indefinite"/>
</g>

<path d="M95 184 C170 178 235 190 310 184 S445 178 520 184 S655 190 730 184 S865 178 940 184 S1060 189 1135 183" class="faint" opacity=".44"/>
<path d="M75 202 C150 195 205 209 280 202 S410 195 485 202 S615 209 690 202 S820 195 895 202 S1025 209 1125 201" class="ink" opacity=".84"/>
<path d="M0 223 C95 216 165 230 255 223 S420 216 510 223 S675 230 765 223 S930 216 1020 223 S1110 227 1200 222" class="soft" opacity=".7"/>
<path d="M0 248 C110 241 175 255 285 248 S460 241 570 248 S745 255 855 248 S1030 241 1200 248" class="soft" opacity=".46"/>

<g opacity=".32">
  <path d="M979 204 C995 201 1011 201 1027 204" class="soft"/>
  <path d="M988 214 C1001 212 1014 212 1022 214" class="faint"/>
</g>

<g id="boat" transform="translate(500 165)">
  <g>
    <path d="M0 19 L46 0 L92 19 L70 42 L20 42 Z" class="boat"/>
    <path d="M46 0 L46 34 M0 19 L46 34 L92 19" class="ink"/>
    <path d="M17 49 C34 45 58 45 76 49" class="soft"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 1;0 0" dur="5.8s" repeatCount="indefinite" additive="sum"/>
  </g>
  <animateTransform attributeName="transform" type="translate" values="500 165;508 165;495 165;500 165" dur="22s" repeatCount="indefinite"/>
</g>
</svg>
